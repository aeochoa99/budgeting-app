<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="app-container">
            <h1>50 30 20 Budget App</h1>

            <div class="income-section">
                <div class="income-input">
                    <label for="">Enter your income: $</label>
                    <input type="number" inputmode="decimal" min="1" step="0.01" placeholder="100.00">
                </div>

                <div class="calculate">
                    <button>CALCULATE</button>
                </div>
            </div>

            <div class="display-budget">
                <div class="needs">
                    <h2>Needs (50%)</h2>
                    <p id="needs">$50</p>
                </div>

                <div class="wants">
                    <h2>Wants (30%)</h2>
                    <p id="wants">$30</p>
                </div>

                <div class="savings">
                    <h2>Savings (20%)</h2>
                    <p id="savings">$20</p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="" target="_blank" rel="noreferrer">GitHub repository</a>
    </div>
</body>
</html>
